app = "crumb-club"
primary_region = "yyz"

[build]
  [build.args]
    ORIGIN = "https://crumb-club.fly.dev"

[env]
  PORT = "3000"
  DATABASE_URL = "/data/crumb.db"
  OTP_MODE = "demo"

# SQLite lives on this volume, so the app runs as a single machine
[mounts]
  source = "crumb_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
